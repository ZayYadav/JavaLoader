name: KEYpanel Security Tests

on:
  pull_request:
    paths:
      - 'KEYpanel/**'
      - '.github/workflows/keypanel-check.yml'
  push:
    branches:
      - main
    paths:
      - 'KEYpanel/**'
      - '.github/workflows/keypanel-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  panel-tests:
    name: PHP lint, security tests and MySQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root-ci-password
          MYSQL_DATABASE: onecore_panel_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot-ci-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, openssl, curl
          coverage: none

      - name: PHP syntax check
        working-directory: KEYpanel
        shell: bash
        run: |
          set -euo pipefail
          find . -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Unit and configuration tests
        working-directory: KEYpanel
        shell: bash
        run: |
          set -euo pipefail
          php tests/run.php
          php tests/config.php

      - name: MySQL encrypted-transport integration test
        working-directory: KEYpanel
        env:
          APP_ENV: development
          APP_URL: https://panel.example.test
          APP_TIMEZONE: UTC
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: onecore_panel_ci
          DB_USER: root
          DB_PASSWORD: root-ci-password
          API_PRIVATE_KEY_PATH: runtime/api-private.pem
          API_PUBLIC_KEY_PATH: runtime/api-public.b64
        shell: bash
        run: |
          set -euo pipefail
          php tests/integration.php

      - name: Ensure private runtime material was cleaned
        working-directory: KEYpanel
        shell: bash
        run: |
          set -euo pipefail
          test ! -e runtime/api-private.pem
          test ! -e runtime/api-public.b64
