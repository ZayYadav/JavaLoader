name: Build JavaLoader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'signing.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'signing.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

concurrency:
  group: javaloader-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      NDK_VERSION: '24.0.8215888'
      BUILD_TOOLS_VERSION: '34.0.0'
      JAVA_LOADER_TLS_PINS: ${{ vars.JAVA_LOADER_TLS_PINS }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Preflight runtime core dependency
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -Rqs 'top\.niunaijun\.blackbox' app/src/main/java; then
            exit 0
          fi

          FOUND_CORE=0
          if [ -d app/libs ]; then
            while IFS= read -r dependency; do
              case "$dependency" in
                *.aar)
                  tmpdir=$(mktemp -d)
                  if unzip -p "$dependency" classes.jar > "$tmpdir/classes.jar" 2>/dev/null \
                    && jar tf "$tmpdir/classes.jar" 2>/dev/null \
                    | grep -q '^top/niunaijun/blackbox/BlackBoxCore\.class$'; then
                    FOUND_CORE=1
                  fi
                  rm -rf "$tmpdir"
                  ;;
                *.jar)
                  if jar tf "$dependency" 2>/dev/null \
                    | grep -q '^top/niunaijun/blackbox/BlackBoxCore\.class$'; then
                    FOUND_CORE=1
                  fi
                  ;;
              esac
            done < <(find app/libs -maxdepth 1 -type f \( -name '*.aar' -o -name '*.jar' \) -print)
          fi

          if [ "$FOUND_CORE" -ne 1 ]; then
            echo '::error title=Missing runtime core dependency::JavaLoader imports top.niunaijun.blackbox.* but the repository does not contain the corresponding BlackBoxCore runtime dependency. Add the legitimate AAR/JAR you are authorized to ship under app/libs; CI intentionally does not download or inject an unpinned runtime core.'
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            'platforms;android-34' \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "ndk;${NDK_VERSION}"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          chmod +x gradlew

      - name: Configure isolated signing identity
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/javaloader-build.jks"

          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] \
            && [ -n "${RELEASE_STORE_PASSWORD:-}" ] \
            && [ -n "${RELEASE_KEY_ALIAS:-}" ] \
            && [ -n "${RELEASE_KEY_PASSWORD:-}" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            STORE_PASSWORD="$RELEASE_STORE_PASSWORD"
            KEY_ALIAS="$RELEASE_KEY_ALIAS"
            KEY_PASSWORD="$RELEASE_KEY_PASSWORD"
            ARTIFACT_TIER='production-signing'
          else
            STORE_PASSWORD='javaloader-ci-only'
            KEY_ALIAS='javaloader-ci'
            KEY_PASSWORD='javaloader-ci-only'
            ARTIFACT_TIER='ci-test-signing'
            keytool -genkeypair \
              -keystore "$KEYSTORE" \
              -storetype JKS \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 3650 \
              -dname 'CN=JavaLoader CI,O=Parallax,C=IN'
          fi

          test -s "$KEYSTORE"
          keytool -exportcert \
            -keystore "$KEYSTORE" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -file "$RUNNER_TEMP/javaloader-cert.der"
          CERT_SHA256=$(sha256sum "$RUNNER_TEMP/javaloader-cert.der" | awk '{print toupper($1)}')
          test "${#CERT_SHA256}" -eq 64

          {
            echo "STORE_FILE=$KEYSTORE"
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
            echo "JAVA_LOADER_ALLOWED_SIGNING_SHA256=$CERT_SHA256"
            echo "JAVA_LOADER_ARTIFACT_TIER=$ARTIFACT_TIER"
          } >> "$GITHUB_ENV"

          echo "Build certificate SHA-256: $CERT_SHA256"
          echo "Artifact tier: $ARTIFACT_TIER"

      - name: Validate Gradle project
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --version
          ./gradlew :app:tasks --no-daemon >/dev/null

      - name: Build debug and release APKs
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build-logs
          ./gradlew :app:assembleDebug :app:assembleRelease \
            --no-daemon --stacktrace \
            2>&1 | tee build-logs/gradle-build.log

      - name: Verify APK structure and signatures
        shell: bash
        run: |
          set -euo pipefail
          APKS=$(find app/build/outputs/apk -type f -name '*.apk' -print)
          test -n "$APKS"

          : > build-logs/apk-verification.txt
          while IFS= read -r apk; do
            echo "== $apk ==" | tee -a build-logs/apk-verification.txt
            unzip -tq "$apk"
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify \
              --verbose --print-certs "$apk" \
              | tee -a build-logs/apk-verification.txt
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/zipalign" -c -v 4 "$apk" >/dev/null
            sha256sum "$apk" | tee -a build-logs/apk-verification.txt
          done <<< "$APKS"

      - name: Check release APK for accidental secret files
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_APK=$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)
          test -n "$RELEASE_APK"
          if unzip -l "$RELEASE_APK" | grep -E 'signing\.properties|local\.properties|\.jks|\.keystore'; then
            echo 'Local/signing secret file found inside APK' >&2
            exit 1
          fi

      - name: Record build metadata
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "artifact_tier=$JAVA_LOADER_ARTIFACT_TIER"
            echo "commit=$GITHUB_SHA"
            echo "ndk=$NDK_VERSION"
            echo "build_tools=$BUILD_TOOLS_VERSION"
            if [ -n "${JAVA_LOADER_TLS_PINS:-}" ]; then
              echo 'tls_pinning=configured'
            else
              echo 'tls_pinning=platform-trust-only'
            fi
          } | tee build-logs/build-metadata.txt

      - name: Upload release APK
        uses: actions/upload-artifact@v6
        with:
          name: javaloader-${{ env.JAVA_LOADER_ARTIFACT_TIER }}-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: javaloader-${{ env.JAVA_LOADER_ARTIFACT_TIER }}-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: javaloader-build-logs
          path: build-logs/
          if-no-files-found: warn
