name: Build JavaLoader Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'signing.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'signing.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

concurrency:
  group: javaloader-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      NDK_VERSION: '24.0.8215888'
      BUILD_TOOLS_VERSION: '34.0.0'
      PRODUCTION_CERT_SHA256: 'B343111BBFA30ED565F9B61A52CF5B34CB2EAF0485EB8B396AB373B2ECCA53D4'
      JAVA_LOADER_TLS_PINS: ${{ vars.JAVA_LOADER_TLS_PINS }}
      JAVA_LOADER_API_PUBLIC_KEY_B64: ${{ vars.JAVA_LOADER_API_PUBLIC_KEY_B64 }}
      JAVA_LOADER_LICENSE_URL: ${{ vars.JAVA_LOADER_LICENSE_URL }}
      JAVA_LOADER_GAME_ID: ${{ vars.JAVA_LOADER_GAME_ID }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            'platforms;android-34' \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "ndk;${NDK_VERSION}"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          chmod +x gradlew

      - name: Configure release signing identity
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/javaloader-release.jks"

          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] \
            && [ -n "${RELEASE_STORE_PASSWORD:-}" ] \
            && [ -n "${RELEASE_KEY_ALIAS:-}" ] \
            && [ -n "${RELEASE_KEY_PASSWORD:-}" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            STORE_PASSWORD="$RELEASE_STORE_PASSWORD"
            KEY_ALIAS="$RELEASE_KEY_ALIAS"
            KEY_PASSWORD="$RELEASE_KEY_PASSWORD"
            ARTIFACT_TIER='production-signing'
          else
            # Compile-only signer. The resulting APK intentionally cannot pass the hard-coded
            # runtime production pin and must never be distributed as production.
            STORE_PASSWORD='javaloader-ci-only'
            KEY_ALIAS='javaloader-ci'
            KEY_PASSWORD='javaloader-ci-only'
            ARTIFACT_TIER='ci-compile-only'
            keytool -genkeypair \
              -keystore "$KEYSTORE" \
              -storetype JKS \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 3650 \
              -dname 'CN=JavaLoader CI Compile Only,O=Parallax,C=IN'
          fi

          test -s "$KEYSTORE"
          keytool -exportcert \
            -keystore "$KEYSTORE" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -file "$RUNNER_TEMP/javaloader-cert.der"
          ACTUAL_CERT_SHA256=$(sha256sum "$RUNNER_TEMP/javaloader-cert.der" | awk '{print toupper($1)}')
          test "${#ACTUAL_CERT_SHA256}" -eq 64

          if [ "$ARTIFACT_TIER" = 'production-signing' ] \
            && [ "$ACTUAL_CERT_SHA256" != "$PRODUCTION_CERT_SHA256" ]; then
            echo "::error::Configured production keystore does not match the pinned OneCore MyThos certificate"
            exit 1
          fi

          {
            echo "STORE_FILE=$KEYSTORE"
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
            echo "JAVA_LOADER_ALLOWED_SIGNING_SHA256=$PRODUCTION_CERT_SHA256"
            echo "JAVA_LOADER_ACTUAL_SIGNING_SHA256=$ACTUAL_CERT_SHA256"
            echo "JAVA_LOADER_ARTIFACT_TIER=$ARTIFACT_TIER"
          } >> "$GITHUB_ENV"

          echo "Pinned production certificate SHA-256: $PRODUCTION_CERT_SHA256"
          echo "Actual build certificate SHA-256: $ACTUAL_CERT_SHA256"
          echo "Artifact tier: $ARTIFACT_TIER"

      - name: Configure licensing build identity
        shell: bash
        run: |
          set -euo pipefail

          if [ "$JAVA_LOADER_ARTIFACT_TIER" = 'production-signing' ]; then
            test -n "${JAVA_LOADER_TLS_PINS:-}" || { echo '::error::JAVA_LOADER_TLS_PINS repository variable is required for production signing'; exit 1; }
            test -n "${JAVA_LOADER_API_PUBLIC_KEY_B64:-}" || { echo '::error::JAVA_LOADER_API_PUBLIC_KEY_B64 repository variable is required for production signing'; exit 1; }
            test -n "${JAVA_LOADER_LICENSE_URL:-}" || { echo '::error::JAVA_LOADER_LICENSE_URL repository variable is required for production signing'; exit 1; }
          else
            if [ -z "${JAVA_LOADER_API_PUBLIC_KEY_B64:-}" ]; then
              openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$RUNNER_TEMP/ci-license-private.pem" >/dev/null 2>&1
              JAVA_LOADER_API_PUBLIC_KEY_B64=$(openssl pkey -in "$RUNNER_TEMP/ci-license-private.pem" -pubout -outform DER 2>/dev/null | base64 -w0)
            fi
            if [ -z "${JAVA_LOADER_TLS_PINS:-}" ]; then
              PIN=$(printf 'javaloader-ci-placeholder-pin' | openssl dgst -sha256 -binary | base64 -w0)
              JAVA_LOADER_TLS_PINS="sha256/${PIN}"
            fi
            if [ -z "${JAVA_LOADER_LICENSE_URL:-}" ]; then
              JAVA_LOADER_LICENSE_URL='https://invalid.example/api/v2/connect'
            fi
          fi

          if [ -z "${JAVA_LOADER_GAME_ID:-}" ]; then
            JAVA_LOADER_GAME_ID='PUBG'
          fi

          {
            echo "JAVA_LOADER_API_PUBLIC_KEY_B64=$JAVA_LOADER_API_PUBLIC_KEY_B64"
            echo "JAVA_LOADER_TLS_PINS=$JAVA_LOADER_TLS_PINS"
            echo "JAVA_LOADER_LICENSE_URL=$JAVA_LOADER_LICENSE_URL"
            echo "JAVA_LOADER_GAME_ID=$JAVA_LOADER_GAME_ID"
          } >> "$GITHUB_ENV"

      - name: Validate Gradle project
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --version
          ./gradlew :app:tasks --no-daemon >/dev/null

      - name: Build release APK only
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build-logs
          ./gradlew :app:assembleRelease \
            --no-daemon --stacktrace \
            2>&1 | tee build-logs/gradle-build.log

      - name: Verify release APK structure and signature
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_APK=$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)
          test -n "$RELEASE_APK"

          unzip -tq "$RELEASE_APK"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify \
            --verbose --print-certs "$RELEASE_APK" \
            | tee build-logs/apk-verification.txt
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/zipalign" -c -v 4 "$RELEASE_APK" >/dev/null
          sha256sum "$RELEASE_APK" | tee -a build-logs/apk-verification.txt

          APKSIG_CERT_SHA256=$("$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify \
            --print-certs "$RELEASE_APK" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | tr -d ':' \
            | tr '[:lower:]' '[:upper:]' \
            | head -n1)
          test -n "$APKSIG_CERT_SHA256"
          test "$APKSIG_CERT_SHA256" = "$JAVA_LOADER_ACTUAL_SIGNING_SHA256"

          if [ "$JAVA_LOADER_ARTIFACT_TIER" = 'production-signing' ]; then
            test "$APKSIG_CERT_SHA256" = "$PRODUCTION_CERT_SHA256"
          else
            echo 'CI compile-only APK is intentionally not production-runnable because its signer differs from the native pin.'
          fi

      - name: Check release APK for accidental secret files
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_APK=$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)
          test -n "$RELEASE_APK"
          if unzip -l "$RELEASE_APK" | grep -E 'signing\.properties|local\.properties|\.jks|\.keystore|private\.pem'; then
            echo 'Local/signing secret file found inside APK' >&2
            exit 1
          fi

      - name: Record build metadata
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "artifact_tier=$JAVA_LOADER_ARTIFACT_TIER"
            echo "commit=$GITHUB_SHA"
            echo "ndk=$NDK_VERSION"
            echo "build_tools=$BUILD_TOOLS_VERSION"
            echo "pinned_production_cert_sha256=$PRODUCTION_CERT_SHA256"
            echo "actual_build_cert_sha256=$JAVA_LOADER_ACTUAL_SIGNING_SHA256"
            echo "license_url=$JAVA_LOADER_LICENSE_URL"
            echo "game_id=$JAVA_LOADER_GAME_ID"
          } | tee build-logs/build-metadata.txt

      - name: Upload release APK
        uses: actions/upload-artifact@v6
        with:
          name: javaloader-${{ env.JAVA_LOADER_ARTIFACT_TIER }}-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: javaloader-release-build-logs
          path: build-logs/
          if-no-files-found: warn
